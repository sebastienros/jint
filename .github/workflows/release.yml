name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # vstest gives a testhost 90 seconds to connect back, and aborts the whole run when it does not.
  # These jobs run four test assemblies at once on a four-core runner, and the net472 host is the one
  # that loses that race: it has the slowest start and goes last. The abort reads as a red leg with no
  # failing test in it -- every assembly reports "Passed!" and the step still exits 1 -- so it costs a
  # diagnosis every time. Five minutes is startup contention rather than a hang; anything genuinely
  # stuck is caught by the suite's own per-test budgets, not by this.
  VSTEST_CONNECTION_TIMEOUT: 300

permissions:
  contents: read

jobs:
  browser-tool:
    uses: ./.github/workflows/browser-tool.yml

  build:

    # Publishing release notes must not push the same NuGet version again.
    if: github.event_name == 'push'
    needs: browser-tool
    runs-on: ubuntu-latest

    # Must match the Environment field of the nuget.org trusted publishing policy.
    # Also the place to add required reviewers if releases should be approval-gated.
    # The policy must allow creating Jint.* packages, including the six Jint.Browser.Tool.<rid> IDs;
    # a policy restricted to new versions of the existing Jint package cannot ship the 5.0 additions.
    environment: nuget

    permissions:
      contents: read
      # Lets the job request a GitHub OIDC token, which is exchanged below for a short-lived
      # nuget.org API key. Without this the NuGet/login step fails.
      id-token: write

    steps:

    - name: Setup NET
      uses: actions/setup-dotnet@v6
      with:
        # 8.0 alongside 10.0 because Jint.Tests and Jint.Tests.PublicInterface run a net8.0 leg:
        # net8.0 is the asset most consumers resolve, and it used to be compiled but never executed.
        # global.json still pins the SDK to 10.0.100, so 10.0 is what actually builds.
        dotnet-version: |
          8.0
          10.0

    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Cache Test262 generated suite
      uses: actions/cache@v6
      with:
        path: Jint.Tests.Test262/Generated
        key: test262-generated-${{ hashFiles('Jint.Tests.Test262/Test262Harness.settings.json') }}

    - name: Test
      run: dotnet test --configuration Release --logger "console;verbosity=quiet" --logger "GitHubActions;summary-include-passed=false;summary-include-skipped=false"

    - name: Determine version from tag
      id: version
      run: |
        # The tag is the single source of truth: v4.14.0 -> 4.14.0, v5.0.0-rc.1 -> 5.0.0-rc.1.
        # Strips only the leading 'v' ("${VERSION//v}" removed every 'v', mangling e.g. v5.0.0-preview).
        VERSION="${GITHUB_REF_NAME#v}"
        # AssemblyVersion/FileVersion must be numeric, so drop any prerelease label.
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "numeric=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
        echo "Releasing $VERSION"

    - name: Pack with dotnet
      run: >
        dotnet pack Jint/Jint.csproj --output artifacts --configuration Release
        -p:Version=${{ steps.version.outputs.version }}
        -p:AssemblyVersion=${{ steps.version.outputs.numeric }}
        -p:FileVersion=${{ steps.version.outputs.numeric }}
        -p:ContinuousIntegrationBuild=True

    # Jint.DevTools ships from the same tag and carries the same version: it references Jint by project and
    # its protocol surface is only meaningful against the engine it was built with, so a version of its own
    # would be a second number to reason about for no gain.
    - name: Pack Jint.DevTools with dotnet
      run: >
        dotnet pack Jint.DevTools/Jint.DevTools.csproj --output artifacts --configuration Release
        -p:Version=${{ steps.version.outputs.version }}
        -p:AssemblyVersion=${{ steps.version.outputs.numeric }}
        -p:FileVersion=${{ steps.version.outputs.numeric }}
        -p:ContinuousIntegrationBuild=True

    # Jint.Browser ships from the same tag and carries the same version, for the same reason Jint.DevTools
    # does: it references Jint by project, and its checked-in DOM bindings are only meaningful against the
    # engine — and the AngleSharp version — they were generated with.
    - name: Pack Jint.Browser with dotnet
      run: >
        dotnet pack Jint.Browser/Jint.Browser.csproj --output artifacts --configuration Release
        -p:Version=${{ steps.version.outputs.version }}
        -p:AssemblyVersion=${{ steps.version.outputs.numeric }}
        -p:FileVersion=${{ steps.version.outputs.numeric }}
        -p:ContinuousIntegrationBuild=True

    # The Model Context Protocol server, from the same tag and the same version, because it is a library
    # over Jint.Browser referenced by project. Packed before the tool, which references it.
    - name: Pack Jint.Browser.Mcp with dotnet
      run: >
        dotnet pack Jint.Browser.Mcp/Jint.Browser.Mcp.csproj --output artifacts --configuration Release
        -p:Version=${{ steps.version.outputs.version }}
        -p:AssemblyVersion=${{ steps.version.outputs.numeric }}
        -p:FileVersion=${{ steps.version.outputs.numeric }}
        -p:ContinuousIntegrationBuild=True

    # The jint-browser dotnet tool, from the same tag and the same version again: it is a shell over
    # Jint.Browser, referenced by project, so a version of its own would be a second number saying nothing.
    # .NET 10 packs the RID-selection manifest here; the six native implementations come from the matrix.
    - name: Pack Jint.Browser.Tool with dotnet
      run: >
        dotnet pack Jint.Browser.Tool/Jint.Browser.Tool.csproj --output artifacts --configuration Release
        -p:BrowserToolNative=true
        -p:Version=${{ steps.version.outputs.version }}
        -p:AssemblyVersion=${{ steps.version.outputs.numeric }}
        -p:FileVersion=${{ steps.version.outputs.numeric }}
        -p:ContinuousIntegrationBuild=True

    - name: Collect native tool packages
      uses: actions/download-artifact@v8
      with:
        pattern: browser-tool-packages-*
        path: artifacts
        merge-multiple: true

    # Kept next to the push: the minted key is short-lived, so it must not be requested
    # before the (slow) test and pack steps.
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: sebastienros

    - name: Push with dotnet
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        # Publish implementations before the manifest so a new tool version never points at absent RIDs.
        for package in artifacts/*.nupkg; do
          if [[ "$package" != artifacts/Jint.Browser.Tool.[0-9]* ]]; then
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi
        done
        dotnet nuget push artifacts/Jint.Browser.Tool.[0-9]*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release-downloads:
    if: github.event_name == 'release'
    needs: browser-tool
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-tool-binary-*
          path: release-assets
          merge-multiple: true

      - name: Attach binaries and checksums to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -type f -name 'jint-browser-*' | wc -l)" -eq 6
          sha256sum jint-browser-* > SHA256SUMS
          gh release upload "$RELEASE_TAG" jint-browser-* SHA256SUMS --clobber
