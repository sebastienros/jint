name: PR

on:

  # Deliberately no "branches:" filter. That filter matches a pull request's *base*, so restricting
  # it to main and 3.x silently skipped CI on every layer of a stacked pull request except the
  # bottom one - the upper layers base on the branch below them, not on main, and showed "no checks
  # reported" until GitHub retargeted them at merge time. Running on every pull request costs a
  # little more CI on the rare cross-branch PR and makes a stack reviewable.
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # vstest gives a testhost 90 seconds to connect back, and aborts the whole run when it does not.
  # These jobs run four test assemblies at once on a four-core runner, and the net472 host is the one
  # that loses that race: it has the slowest start and goes last. The abort reads as a red leg with no
  # failing test in it -- every assembly reports "Passed!" and the step still exits 1 -- so it costs a
  # diagnosis every time. Five minutes is startup contention rather than a hang; anything genuinely
  # stuck is caught by the suite's own per-test budgets, not by this.
  VSTEST_CONNECTION_TIMEOUT: 300

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  test:

    name: ${{ matrix.os.name }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: 'linux', image: 'ubuntu-latest' }
          - { name: 'linux - ARM', image: 'ubuntu-24.04-arm' }
          # The WPT corpus inventory in Jint.Tests/Wpt/Vendor/README.md is measured on Windows — assertion
          # counts move per operating system — so this is the one leg entitled to check it. The census reuses
          # the outcomes the suites produce anyway and cost 65 s -> 85 s of Jint.Tests when it was measured
          # always-on, which is why it is opt-in everywhere else rather than part of an ordinary run.
          - { name: 'windows', image: 'windows-latest', census: '1' }
          - { name: 'macos', image: 'macos-latest' }

    runs-on: ${{ matrix.os.image }}

    env:
      JINT_WPT_CENSUS: ${{ matrix.os.census }}

    steps:

    - name: Setup NET
      uses: actions/setup-dotnet@v6
      with:
        # 8.0 alongside 10.0 because Jint.Tests and Jint.Tests.PublicInterface run a net8.0 leg:
        # net8.0 is the asset most consumers resolve, and it used to be compiled but never executed.
        # global.json still pins the SDK to 10.0.100, so 10.0 is what actually builds.
        dotnet-version: |
          8.0
          10.0

    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Cache Test262 generated suite
      uses: actions/cache@v6
      with:
        path: Jint.Tests.Test262/Generated
        key: test262-generated-${{ hashFiles('Jint.Tests.Test262/Test262Harness.settings.json') }}
        # The generated suite is pure codegen (identical on every OS), so share one cache across
        # platforms. Without this, only the Build workflow (Linux) ever seeds the cache and the
        # Windows/macOS/ARM jobs regenerate the whole suite on every run.
        enableCrossOsArchive: true

    - name: Test
      run: dotnet test --configuration Release --logger "console;verbosity=quiet" --logger "GitHubActions;summary-include-passed=false;summary-include-skipped=false"

  # The matrix above is the shipped configuration: Release with host-contract verification off, which is what
  # the probe-count and no-descriptor pins in Jint.Tests.PublicInterface document as costing nothing. This leg
  # is the other one an embedder is told to use — the shipped Release package with
  # Jint.EnableHostContractVerification set — so that a verifier which misbehaves under the Release JIT, or a
  # gating bug, fails here rather than in someone's integration suite. One OS is enough: the verifiers are
  # platform-independent, and the switch is set the same way everywhere.
  test-release-verification:

    name: 'linux - host-contract verification'

    runs-on: ubuntu-latest

    env:
      JINT_HOST_CONTRACT_VERIFICATION: 1

    steps:

    - name: Setup NET
      uses: actions/setup-dotnet@v6
      with:
        # 8.0 alongside 10.0 because Jint.Tests and Jint.Tests.PublicInterface run a net8.0 leg:
        # net8.0 is the asset most consumers resolve, and it used to be compiled but never executed.
        # global.json still pins the SDK to 10.0.100, so 10.0 is what actually builds.
        dotnet-version: |
          8.0
          10.0

    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Test Jint.Tests
      run: dotnet test Jint.Tests/Jint.Tests.csproj --configuration Release --logger "console;verbosity=quiet" --logger "GitHubActions;summary-include-passed=false;summary-include-skipped=false"

    - name: Test Jint.Tests.PublicInterface
      run: dotnet test Jint.Tests.PublicInterface/Jint.Tests.PublicInterface.csproj --configuration Release --logger "console;verbosity=quiet" --logger "GitHubActions;summary-include-passed=false;summary-include-skipped=false"

  # <IsAotCompatible> is a csproj property, not evidence. Jint sets it for net7.0+ and then suppresses the
  # eight IL codes that would substantiate it, so nothing in the repository could tell an embedder whether a
  # published Jint actually runs — until this leg. It publishes Jint.AotExample with PublishAot=true and
  # *runs the native binary*, which is the only place a Native AOT failure appears: the analysis warnings say
  # what might break, the run says what does. The warnings are summarised into the job summary rather than
  # gating, because paying them down is separate work and a red leg for a known 122 would be ignored within
  # a week. What gates is the binary: Jint.AotExample/Program.cs pins both directions, so a probe that stops
  # working AND a known gap that starts working fail here.
  #
  # One OS is enough — the gaps are ILC generic-instantiation gaps, not platform ones — and Linux is the
  # cheapest runner whose image already carries the native toolchain.
  aot:

    name: 'linux - native aot'

    runs-on: ubuntu-latest

    steps:

    - name: Setup NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0

    - name: Checkout source code
      uses: actions/checkout@v7

    # Native AOT shells out to the platform C++ toolchain to link. The runner image already carries clang and
    # zlib1g-dev, so this checks rather than installs: an unconditional apt-get update costs ~15 s on every
    # run to reinstall what is already there, and an unconditional apt-get install fails on a stale index.
    - name: Ensure the Native AOT toolchain is present
      run: |
        if command -v clang > /dev/null && dpkg -s zlib1g-dev > /dev/null 2>&1; then
          echo "already present: $(clang --version | head -1)"
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
        fi

    - name: Publish Jint.AotExample with Native AOT
      run: |
        set -o pipefail
        dotnet publish Jint.AotExample/Jint.AotExample.csproj --configuration Release 2>&1 | tee aot-publish.log

    # The binary either prints ALL PROBES PASSED and exits 0, or names the probe that failed and exits 1. The
    # grep is not redundant: it is what catches a Program.cs that stopped running any probes at all.
    - name: Run the native binary
      run: |
        set -o pipefail
        ./artifacts/publish/Jint.AotExample/release/Jint.AotExample | tee aot-run.log
        grep -q '^ALL PROBES PASSED' aot-run.log

    # if: always() so the inventory is still written when the run step above went red, which is exactly when
    # someone wants to read it. Every command here therefore has to survive a missing log.
    - name: Summarise the trim and AOT analysis warnings
      if: always()
      run: |
        {
          echo '### Native AOT analysis diagnostics'
          echo
          echo 'ILC re-derives these over the whole closed program, so the `NoWarn` in `Jint/Jint.csproj` does not reach them.'
          echo
          echo '| code | count |'
          echo '| --- | --- |'
          grep -hoE 'IL[0-9]{4}' aot-publish.log 2>/dev/null | sort | uniq -c | sort -rn | awk '{ print "| " $2 " | " $1 " |" }'
          echo
          echo "total: $(grep -hcE 'IL[0-9]{4}' aot-publish.log 2>/dev/null || echo 0)"
          echo
          echo '### Probe run'
          echo
          echo '```'
          cat aot-run.log 2>/dev/null || echo '(the binary produced no output)'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  # Everything else in this workflow reaches the [JsAccessible] source generator through an Analyzer
  # PROJECT reference, which says nothing about whether the .nupkg carries it — and until this job the
  # feature was public API that no consumer outside the repository could obtain. So: pack, restore the
  # package into a project shaped like a third party's, compile an annotated type, and run it. A build
  # that merely succeeds is not the evidence; the run is, because a package with no generator in it
  # would still compile every line of Jint's own API.
  #
  # Windows, because net472 is half the point and only Windows can run it. Both shipped extremes are
  # built from one project: net472, whose C# language version is 7.3 and where the run-time compiled
  # member lanes decline outright — so it has the most to gain and the oldest compiler — and net10.0
  # with nullable reference types on and warnings as errors.
  package-consumer:

    name: 'windows - packaged generator'

    runs-on: windows-latest

    steps:

    - name: Setup NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0

    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Pack
      run: dotnet pack Jint/Jint.csproj --configuration Release

    # Two assertions on the artefact itself. The second is the load-bearing one: Jint.SourceGenerators
    # emits its attribute set through RegisterPostInitializationOutput unconditionally, and that source
    # declares members typed Jint.Native.Function.FastCallGuard, which is internal — so packing that
    # analyzer would break every consumer's build before a line of their own code.
    - name: The package carries the interop generator, and only that one
      shell: pwsh
      run: |
        $nupkg = Get-ChildItem artifacts/package/release/Jint.*.nupkg | Select-Object -First 1
        if (-not $nupkg) { throw 'dotnet pack produced no Jint package' }
        Write-Host "inspecting $($nupkg.Name)"
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
        $analyzers = @($zip.Entries | Where-Object { $_.FullName -like 'analyzers/*' } | ForEach-Object { $_.FullName })
        $zip.Dispose()
        $analyzers | ForEach-Object { Write-Host "  $_" }
        if ($analyzers -notcontains 'analyzers/dotnet/cs/Jint.SourceGenerators.Interop.dll') {
          throw 'the package carries no [JsAccessible] generator, so no consumer can obtain the feature'
        }
        if ($analyzers | Where-Object { $_ -like '*/Jint.SourceGenerators.dll' }) {
          throw 'the package carries Jint.SourceGenerators.dll, whose post-initialization output does not compile outside Jint'
        }

    # The consumer has an empty Directory.Build.props of its own and a RestorePackagesPath of its own,
    # so it inherits nothing from this repository and cannot be served a cached Jint of the same
    # version from an earlier build.
    - name: Build the consumer against the package
      run: dotnet build tools/package-consumer/PackageConsumer.csproj --configuration Release

    - name: Run it on net10.0
      shell: bash
      run: |
        set -o pipefail
        ./tools/package-consumer/bin/Release/net10.0/PackageConsumer.exe | tee net10.log
        grep -q '^ALL PROBES PASSED' net10.log

    - name: Run it on net472
      shell: bash
      run: |
        set -o pipefail
        ./tools/package-consumer/bin/Release/net472/PackageConsumer.exe | tee net472.log
        grep -q '^ALL PROBES PASSED' net472.log

    # The other half of the contract: a host who insists that no member of theirs falls back to
    # reflection says so in .editorconfig, with no attribute property and no MSBuild switch. That works
    # only while the reported diagnostics carry a Location with a SourceTree — the compiler resolves
    # dotnet_diagnostic severity per syntax tree — and it is invisible in every snapshot, so a real
    # build against the shipped package is the only place it can be checked.
    - name: A promoted decline fails the consumer's build
      shell: bash
      run: |
        printf '\n[*.cs]\ndotnet_diagnostic.JINT033.severity = error\n' >> tools/package-consumer/.editorconfig
        if dotnet build tools/package-consumer/PackageConsumer.csproj --configuration Release -f net10.0 --no-incremental > promoted.log 2>&1; then
          echo 'the build succeeded, so .editorconfig severity did not reach JINT033'
          cat promoted.log
          exit 1
        fi
        grep -q 'error JINT033' promoted.log
