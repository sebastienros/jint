name: Hosted browser comparison feasibility
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verification, calibration/comparison, or a diagnostics-only 30-minute idle audit
        type: choice
        options: [inspect, idle-audit, verify, calibrate, compare]
        default: verify
      browser_pins:
        description: Optional JSON replacing hosted-pins.json (chromium URL/hash/version; lightpanda URL/hash/asset ID)
        type: string
        required: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: hosted-browser-comparison
  cancel-in-progress: false
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PHASE: ${{ inputs.phase }}
      BROWSER_PINS: ${{ inputs.browser_pins }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        if: inputs.phase != 'idle-audit'
        with:
          dotnet-version: '10.0'
      - name: Preserve runner and dispatch provenance
        run: |
          OUTPUT="$RUNNER_TEMP/browser-comparison"
          printf 'OUTPUT=%s\n' "$OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$OUTPUT"
          printf 'APPARMOR_PROFILE=jint-chromium-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          if [[ -n "$BROWSER_PINS" ]]; then
            printf '%s\n' "$BROWSER_PINS" > "$OUTPUT/pins.json"
          else
            cp tools/browser-comparison/hosted-pins.json "$OUTPUT/pins.json"
          fi
          uname -a > "$OUTPUT/uname.txt"
          lscpu > "$OUTPUT/lscpu.txt"
          if [[ "$PHASE" != idle-audit ]]; then dotnet --info > "$OUTPUT/dotnet-info.txt"; fi
          systemd --version > "$OUTPUT/systemd-version.txt"
          printf '%s\n' "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT sha=$GITHUB_SHA phase=$PHASE" "image=$ImageOS version=$ImageVersion" > "$OUTPUT/runner.txt"
      - name: Audit unchanged aggregate idle guard for 30 minutes (diagnostics only)
        if: inputs.phase == 'idle-audit'
        run: python3 tools/browser-comparison/idle_audit.py --output "$OUTPUT/idle-audit"
      - name: Inspect or repair the bounded hosted LLDB library defect
        if: inputs.phase != 'idle-audit'
        run: |
          args=()
          if [[ "$PHASE" == inspect ]]; then args+=(--inspect); fi
          python3 tools/browser-comparison/repair_hosted_libraries.py --output "$OUTPUT/library-preflight" "${args[@]}"
      - name: Install and verify exact browser assets before collection
        if: inputs.phase != 'inspect' && inputs.phase != 'idle-audit'
        run: python3 tools/browser-comparison/setup_hosted.py --pins "$OUTPUT/pins.json" --output "$OUTPUT/setup" --apparmor-profile-name "$APPARMOR_PROFILE"
      - name: Allow user namespaces for only this downloaded Chromium executable
        if: inputs.phase != 'inspect' && inputs.phase != 'idle-audit'
        run: |
          profile="/etc/apparmor.d/$APPARMOR_PROFILE"
          test ! -e "$profile"
          sudo install -o root -g root -m 0644 "$OUTPUT/setup/chromium-userns.profile" "$profile"
          printf '%s\n' "$profile" > "$OUTPUT/apparmor-owned-profile.txt"
          sudo apparmor_parser --add "$profile" 2>&1 | tee "$OUTPUT/apparmor-load.log"
          printf 'loaded=%s\n' "$APPARMOR_PROFILE" > "$OUTPUT/apparmor-loaded.txt"
      - name: Build Jint in Release before collection
        if: inputs.phase != 'inspect' && inputs.phase != 'idle-audit'
        run: dotnet build Jint.Browser.Tool/Jint.Browser.Tool.csproj -c Release -f net10.0 | tee "$OUTPUT/jint-build.log"
      - name: Verify offline browser workloads
        if: inputs.phase == 'verify'
        run: bash tools/browser-comparison/run_hosted.sh "$PHASE" "$OUTPUT" 2>&1 | tee "$OUTPUT/driver.log"
      - name: Run serial collection in a scoped delegated unit
        if: inputs.phase == 'calibrate' || inputs.phase == 'compare'
        run: |
          sudo systemd-run --wait --pipe --collect \
            --unit="jint-comparison-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property='Delegate=cpu memory' --property=DelegateSubgroup=controller \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" \
            --property=RuntimeMaxSec=21000 --property=KillMode=control-group \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv="DOTNET_ROOT=$DOTNET_ROOT" \
            /usr/bin/bash tools/browser-comparison/run_hosted.sh "$PHASE" "$OUTPUT" 2>&1 | tee "$OUTPUT/driver.log"
      - name: Stop only this run's owned service
        if: always() && (inputs.phase == 'calibrate' || inputs.phase == 'compare')
        run: sudo systemctl stop "jint-comparison-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.service" || true
      - name: Remove only this run's Chromium AppArmor profile
        if: always() && inputs.phase != 'inspect' && inputs.phase != 'idle-audit'
        run: |
          if [[ -f "$OUTPUT/apparmor-owned-profile.txt" ]]; then
            profile="/etc/apparmor.d/$APPARMOR_PROFILE"
            test "$(cat "$OUTPUT/apparmor-owned-profile.txt")" = "$profile"
            status=0
            # Redirect to the runner-owned artifact, not a privileged policy file.
            # shellcheck disable=SC2024
            sudo apparmor_parser --remove "$profile" > "$OUTPUT/apparmor-remove.log" 2>&1 || status=$?
            sudo rm -- "$profile"
            exit "$status"
          fi
      - name: Preserve complete or refused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-comparison-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-comparison
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
