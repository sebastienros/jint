# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Dependencies are split into logical groups so each weekly PR is cohesive and
# easy to review/revert, instead of one large PR bumping everything at once.
# A dependency is placed in the FIRST group whose patterns it matches, so the
# groups below are ordered most-specific first, with the broad "microsoft"
# catch-all last. Packages that match no group get their own individual PR.

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Never newer than the Roslyn of the SDK floor in global.json. Our source generators are loaded by
      # the build's own compiler, which rejects one built against a newer Roslyn (CS9057), so a bump here
      # can silently raise the minimum SDK. It is moved by hand; see the note in Directory.Packages.props. Also covers the 4.8.0 VersionOverride in Jint.SourceGenerators.Interop,
      # which is a consumer-facing floor.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
    groups:
      # Roslyn analyzers and source generators (build-time only).
      analyzers:
        patterns:
          - "Meziantou.Analyzer"
          - "Microsoft.CodeAnalysis.*"
          - "PolySharp"
      # Test frameworks, runners, adapters and assertion/helper libraries.
      testing:
        patterns:
          - "NUnit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Extensions.TimeProvider.Testing"
          - "AwesomeAssertions"
          - "Verify.*"
          - "GitHubActionsTestLogger"
          - "Test262Harness"
          - "MongoDB.Bson.signed"
          - "Flurl.Http.Signed"
      # Benchmarking tooling.
      benchmark:
        patterns:
          - "BenchmarkDotNet*"
      # Alternative JS engines used only for comparison benchmarks/tests.
      js-engine-comparisons:
        patterns:
          - "NiL.JS"
          - "Okojo"
          - "YantraJS.Core"
      # The Acornima parser packages, which are versioned in lockstep.
      acornima:
        patterns:
          - "Acornima*"
      # Remaining Microsoft / System runtime packages
      # (e.g. Microsoft.Extensions.DependencyInjection, System.Text.Json).
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"

  # GitHub Actions used by the workflows under .github/workflows. Kept in a single
  # grouped PR so the whole workflow tooling moves together instead of one PR per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  # The same update for the 4.x maintenance branch. Dependabot reads this file from the default branch
  # only, so a branch it should keep current needs an entry that names it. NuGet has no 4.x entry on
  # purpose: a package that ships with 4.x moves there as a reviewed backport, and 4.x's test stack
  # (xUnit v3) is not the one the groups above describe.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "4.x"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
